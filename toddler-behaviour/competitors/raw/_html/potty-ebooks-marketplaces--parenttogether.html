b4da5&quot;,&quot;thumbnail&quot;:null,&quot;id&quot;:&quot;041f44a8fea9efac1ef130841c3633a4&quot;,&quot;type&quot;:&quot;image&quot;,&quot;filetype&quot;:&quot;jpg&quot;,&quot;width&quot;:670,&quot;height&quot;:376,&quot;native_width&quot;:1920,&quot;native_height&quot;:1080},{&quot;url&quot;:&quot;https://public-files.gumroad.com/ilxktj789pid7z0ck8bd9ly8ujh9&quot;,&quot;original_url&quot;:&quot;https://public-files.gumroad.com/t4rrczt988mlwihdj8a8p6z4c3pt&quot;,&quot;thumbnail&quot;:null,&quot;id&quot;:&quot;6acb83a630160e4b3abd542633845726&quot;,&quot;type&quot;:&quot;image&quot;,&quot;filetype&quot;:&quot;jpg&quot;,&quot;width&quot;:670,&quot;height&quot;:376,&quot;native_width&quot;:1920,&quot;native_height&quot;:1080}],&quot;main_cover_id&quot;:&quot;041f44a8fea9efac1ef130841c3633a4&quot;,&quot;thumbnail_url&quot;:&quot;https://public-files.gumroad.com/pk970bfjn28h99ahahovvn5rvkjo&quot;,&quot;quantity_remaining&quot;:null,&quot;long_url&quot;:&quot;https://parenttogether.gumroad.com/l/pottylearning&quot;,&quot;is_sales_limited&quot;:false,&quot;ratings&quot;:{&quot;count&quot;:0,&quot;average&quot;:0.0,&quot;percentages&quot;:[0,0,0,0,0]},&quot;seller_reputation&quot;:null,&quot;custom_button_text_option&quot;:&quot;i_want_this_prompt&quot;,&quot;is_compliance_blocked&quot;:false,&quot;is_published&quot;:true,&quot;is_stream_only&quot;:true,&quot;streamable&quot;:true,&quot;sales_count&quot;:19,&quot;summary&quot;:&quot;A total of 8 videos (approx 80 min) and a PDF handbook with a summary of a respectful, research-based potty training method.&quot;,&quot;attributes&quot;:[{&quot;name&quot;:&quot;Potty Mastery - Introduction&quot;,&quot;value&quot;:&quot;&quot;},{&quot;name&quot;:&quot;Potty Mastery - The Method&quot;,&quot;value&quot;:&quot;&quot;},{&quot;name&quot;:&quot;Potty Mastery - Naps \u0026 Nights&quot;,&quot;value&quot;:&quot;&quot;},{&quot;name&quot;:&quot;Potty Mastery - Tips \u0026 Extras&quot;,&quot;value&quot;:&quot;&quot;},{&quot;name&quot;:&quot;Potty Mastery - How to adapt it to your child&quot;,&quot;value&quot;:&quot;&quot;},{&quot;name&quot;:&quot;Potty Mastery - The Handbook&quot;,&quot;value&quot;:&quot;&quot;},{&quot;name&quot;:&quot;Potty Mastery - Constipation \u0026 Withholding&quot;,&quot;value&quot;:&quot;&quot;}],&quot;description_html&quot;:&quot;\u003ch3\u003e\u003cstrong\u003ePotty Mastery - Is  this course for me?\u003c/strong\u003e\u003c/h3\u003e\u003cul\u003e\n\u003cli\u003eIf your child is 12 months and up\u003c/li\u003e\n\u003cli\u003eIf you are wondering whether your toddler is ready to start potty learning\u003c/li\u003e\n\u003cli\u003eIf you think your child may be ready, but you find the information out there confusing\u003c/li\u003e\n\u003cli\u003eIf you are unsure of how to start or you are stuck trying to teach your child to use the potty\u003c/li\u003e\n\u003cli\u003eIf you would like to learn a method that is respectful AND that prioritises learning about their body\u003c/li\u003e\n\u003cli\u003eIf you want a method without rewards (or punishments)\u003c/li\u003e\n\u003cli\u003eIf you&#39;ve tried a different method of potty training but it didn&#39;t work\u003c/li\u003e\n\u003cli\u003eIf you have a toddler who is withholding wee or poo\u003c/li\u003e\n\u003cli\u003eIf you would like practical tips to deal with fear or resistance to use the potty (again, no rewards or bribing here either)\u003c/li\u003e\n\u003cli\u003eIf you would like to approach potty learning differently and maybe even have fun....!\u003c/li\u003e\n\u003cli\u003eIf you&#39;re looking for a method that is not authoritarian but respects your needs too, then this course is for you. \u003c/li\u003e\n\u003c/ul\u003e\u003cp\u003eThis course will help you decide when to start, how to prepare, how to start and what you need to buy (or not buy). \u003c/p\u003e\u003cp\u003eYou will get a 1.5 hour video course (around 85 mins) broken down into manageable chunks, as well as a 10-page PDF handbook with more tips and ideas. You will have life-time access to watch the class as many times as you need. \u003c/p\u003e\u003cp\u003eThe course includes everything you need to start the learning process and transition out of nappies, supporting your child to learn about their body. \u003c/p\u003e\u003cp\u003eThere is also the option of booking a troubleshooting consultation at a reduced price. This bundle is ideal if you&#39;re feeling stuck or if you tried a method that didn&#39;t work or you&#39;re experiencing refusal to poo anywhere but in a nappy, so we can delve deeper into what&#39;s going on for your child. \u003c/p\u003e\u003cblockquote\u003e\n\u003cp\u003e\u003cem\u003eIn December 2020 I did your potty training course when my eldest daughter was 30 months old, I felt I had been given very inconsistent and, in retrospect, incorrect advice from the health visitors and as a result potty training seemed extremely daunting.\u003c/em\u003e\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eHowever your course gave me the confidence we needed and we started right away. Despite always being very hesitant with potty training when we’ve tried before, this time my daughter just got it straight away and we never looked back. \u003c/em\u003e\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eI kept everything I’d learnt from your course in my mind and approached potty training with my youngest daughter in a totally different way. It was very gradual and all felt very natural.  (...) at 19 months we took the plunge and she has been dry in the day ever since.\u003c/em\u003e\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eTo have been able to do it when she was nearly a year younger than her sister was such a achievement for us and I would never had had the confidence were it not for doing your course. Jess, mum of 2\u003c/em\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\u003cp\u003eTo find out more about me visit my website:\u003c/p\u003e\u003cfigure\u003e\u003ca href=\&quot;https://parenttogether.co.uk/\&quot; target=\&quot;_blank\&quot; rel=\&quot;noopener noreferrer nofollow\&quot;\u003e\u003cimg src=\&quot;https://public-files.gumroad.com/g4457wtxxwjt7gem0m6zw6e93071\&quot;\u003e\u003c/a\u003e\u003cp class=\&quot;figcaption\&quot;\u003e\u003c/p\u003e\u003c/figure\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e&quot;,&quot;currency_code&quot;:&quot;gbp&quot;,&quot;price_cents&quot;:2200,&quot;buyer_currency_display&quot;:{&quot;product_id&quot;:&quot;JF6mUsyl3LnJ4fB_m1_Ydw==&quot;,&quot;buyer_currency_shown&quot;:&quot;gbp&quot;,&quot;product_currency&quot;:&quot;gbp&quot;,&quot;buyer_local_price_cents&quot;:null,&quot;rate&quot;:null,&quot;display_mode&quot;:&quot;default&quot;},&quot;rental_price_cents&quot;:null,&quot;pwyw&quot;:null,&quot;eligible_for_installment_plans&quot;:true,&quot;allow_installment_plan&quot;:false,&quot;installment_plan&quot;:null,&quot;is_legacy_subscription&quot;:false,&quot;is_tiered_membership&quot;:false,&quot;is_recurring_billing&quot;:false,&quot;is_physical&quot;:false,&quot;custom_view_content_button_text&quot;:&quot;Watch class&quot;,&quot;is_multiseat_license&quot;:false,&quot;is_licensed&quot;:false,&quot;hide_sold_out_variants&quot;:false,&quot;native_type&quot;:&quot;digital&quot;,&quot;preorder&quot;:null,&quot;duration_in_months&quot;:null,&quot;rental&quot;:null,&quot;is_quantity_enabled&quot;:false,&quot;free_trial&quot;:null,&quot;recurrences&quot;:null,&quot;options&quot;:[{&quot;id&quot;:&quot;uOBkwy2e87EmivXC899NRQ==&quot;,&quot;name&quot;:&quot;Potty Mastery Class&quot;,&quot;quantity_left&quot;:null,&quot;description&quot;:&quot;The whole pre-recorded class (7 videos = 70 mins) to learn at your own pace and a PDF handbook with a summary of the method and extra tips and phrases to use. &quot;,&quot;price_difference_cents&quot;:0,&quot;recurrence_price_values&quot;:null,&quot;is_pwyw&quot;:false,&quot;duration_in_minutes&quot;:null},{&quot;id&quot;:&quot;vCekX0x7o700roBGG8t_pw==&quot;,&qu
