<!-- =========================
  CANCEL SUBSCRIPTION SCRIPT
  Handles dynamic "Cancel Subscription" button, confirmation, and Zapier webhook
  ========================= -->

<script>
document.addEventListener('DOMContentLoaded', async function () {
  const userSubscriptionWrapper = document.querySelector('#user_subscription');
  const cancelDialog = document.getElementById('cancelSubscriptionDialog');
  const confirmCancelBtn = document.getElementById('confirmCancel');
  const closeDialogBtn = document.getElementById('closeDialog');

  if (!userSubscriptionWrapper) return;

  try {
    // --- Get session and user info ---
    const session = await axios.get('/api/sessions', { headers: { 'Accept': 'application/json' } });
    if (!session.data.logged) return;

    const userResponse = await axios.get('/api/users/me', { headers: { 'Accept': 'application/json' } });
    const user = userResponse.data;
    if (!user.subscriber) return;

    const subscriptionResponse = await axios.get('/api/subscriptions/active', { headers: { 'Accept': 'application/json' } });
    const subscription = subscriptionResponse.data;
    if (!subscription.with_manual_billing) return;

    // --- Add "Cancel Subscription" button dynamically ---
    const cancelButton = document.createElement('button');
    cancelButton.classList.add('custom-cancel-subscription');
    cancelButton.textContent = "Cancel Subscription";
    userSubscriptionWrapper.insertAdjacentElement('afterEnd', cancelButton);

    // --- Show confirmation dialog ---
    cancelButton.addEventListener('click', () => cancelDialog.showModal());

    // --- Confirm cancellation and send to Zapier ---
    confirmCancelBtn.addEventListener('click', async () => {
      try {
        const userEmail = user.email;
        if (userEmail) {
          await axios.post(
            'https://hooks.zapier.com/hooks/catch/7823208/20g829e/',
            JSON.stringify({ email: user.email })
          );
          alert("Your subscription cancellation request has been sent.");
          cancelButton.style.display = 'none';
          cancelDialog.close();
        }
        // Redirect after confirmation
        setTimeout(() => location.replace('/catalog'), 1000);
      } catch (error) {
        alert("Failed to send the cancellation request.");
        cancelButton.style.display = 'none';
        cancelDialog.close();
      }
    });

    // --- Close dialog without canceling ---
    closeDialogBtn.addEventListener('click', () => cancelDialog.close());

  } catch (error) {
    console.error("Error fetching user data:", error);
  }
});
</script>

<!--
  Uscreen Support Snippet
  Description: "Pay with HSA/FSA" (WithFlex) choice on the checkout payment step, on every checkout arm:
               legacy /checkout/new?o=<id>, unified /buy/<session>, React /r/buy/<session>.
               The offer id comes from ?o= when present, else from #offer-id (Hotwire) or
               [data-test="product-info"][data-product-id] (React). DOM writes start after window load
               (plus one second on /r/ pages) so React hydration is never disturbed. The rule that hides the
               native payment form is added by script, so it survives a hydration retry that drops head styles.
  Added by: Galina Bondarenko (MON-5592)
  Date: 2026-10-21
-->
<script>
(function () {
  'use strict';
  if (window.flexHsaSnippet) return;
  window.flexHsaSnippet = true;

  var LINKS = {
      "34280": "https://checkout.withflex.com/pay/l/fplink_01k30x7mqmzw84xmyzagys7zs6",
      "66701": "https://checkout.withflex.com/pay/l/fplink_01k30y31nd4e8x8e2zrs0dsb4v",
      "34281": "https://checkout.withflex.com/pay/l/fplink_01k30yhvnhne1d3n2a102xczgx"
  };
  var HIDE_NATIVE = false;
  var ZAPIER_HOOK = null;
  var CARD_ICON = '<svg class="payment-icon" viewBox="0 0 24 24"><path d="M3 4h18c1.1 0 2 .9 2 2v12c0 1.1-.9 2-.9 2H3c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2zm0 2v2h18V6H3zm0 12h18v-6H3v6z"></path></svg>';
  var LIST_ICON = '<svg class="payment-icon" viewBox="0 0 24 24"><path d="M21 8H3V6h18v2zm-2 6H5v-2h14v2zm0 4H5v-2h14v2zm0 4H5v-2h14v2zm-7-18h2v2h-2V4z"></path></svg>';
  var HSA_LINK = function (href) {
    return '<a href="' + href + '">' + CARD_ICON + ' Pay with HSA/FSA</a>';
  };
  var CARD_BUTTON = '<button type="button" data-flex-hsa-native>' + LIST_ICON + ' Pay with a Credit Card</button>';
  var markup = function (href) {
    return '<div class="hsa-option" style="margin-top:24px; padding:24px; border:1px solid #e5e5e5; border-radius:8px; background:#fff;">' +
      '<div style="font-weight:600; font-size:16px; color:#111; margin-bottom:10px;">Paying with HSA/FSA funds?</div>' +
      HSA_LINK(href) +
      '<p style="margin:10px 0 0; font-size:13px; color:#666;">You\'ll finish checkout on Flex, our HSA/FSA payment partner, including a quick eligibility step. Prefer a regular card or PayPal? Use the payment options below.</p>' +
      '</div>';
  };

  var CHECKOUT_PAGE = /^\/(?:r\/)?buy\/[^/]+\/?$|^\/checkout\/new\/?$/;
  var CONTAINERS = '#billing_frame, [data-test="payment-step"], #billing_and_order_details';
  var state = { session: null, inFlight: false, nativeFor: null, pinged: {} };

  function offerId() {
    var fromUrl = new URLSearchParams(location.search).get('o');
    if (fromUrl) return fromUrl;
    var el = document.querySelector('#offer-id[data-value], [data-test="product-info"][data-product-id]');
    return el ? (el.getAttribute('data-value') || el.getAttribute('data-product-id')) : null;
  }

  function wrapper() {
    return document.querySelector('[data-flex-hsa-wrapper]');
  }

  function container() {
    var nodes = document.querySelectorAll(CONTAINERS);
    for (var i = 0; i < nodes.length; i++) if (nodes[i].isConnected) return nodes[i];
    return null;
  }

  var HIDE_RULE = 'html[data-flex-hsa="choice"] #billing_frame, html[data-flex-hsa="choice"] #billing_and_order_details, ' +
    'html[data-flex-hsa="choice"] [data-test="payment-step"] { display: none !important; }';

  function ensureStyle() {
    if (document.getElementById('flex-hsa-style')) return;
    var style = document.createElement('style');
    style.id = 'flex-hsa-style';
    style.textContent = HIDE_RULE;
    document.head.appendChild(style);
  }

  function setChoice(on) {
    if (on && HIDE_NATIVE) {
      ensureStyle();
      document.documentElement.setAttribute('data-flex-hsa', 'choice');
    } else {
      document.documentElement.removeAttribute('data-flex-hsa');
    }
  }

  function clear() {
    var w = wrapper();
    if (w) w.remove();
    setChoice(false);
  }

  function enc(value) {
    return encodeURIComponent(String(value || '').trim());
  }

  function ping(id, session, nameParts) {
    if (!ZAPIER_HOOK || state.pinged[id]) return;
    state.pinged[id] = true;
    try {
      fetch(ZAPIER_HOOK, {
        method: 'POST',
        mode: 'no-cors',
        body: JSON.stringify({
          email: session.email,
          currentPath: '/checkout/new?o=' + id,
          pagePath: location.pathname,
          offerId: id,
          firstName: nameParts[0] || '',
          lastName: nameParts.slice(1).join(' ')
        })
      });
    } catch (e) {}
  }

  function render(id, link, target) {
    var session = state.session;
    var nameParts = String(session.name || '').trim().split(/\s+/);
    var href = link + '?email=' + enc(session.email) +
      '&first_name=' + enc(nameParts[0]) + '&last_name=' + enc(nameParts.slice(1).join(' '));
    target.insertAdjacentHTML('beforebegin',
      '<section class="payment-wrapper" data-flex-hsa-wrapper="' + id + '">' + markup(href) + '</section>');
    setChoice(true);
    ping(id, session, nameParts);
  }

  function loadSession() {
    if (state.inFlight) return;
    state.inFlight = true;
    fetch('/api/sessions', { headers: { Accept: 'application/json' }, credentials: 'same-origin' })
      .then(function (r) { return r.json(); })
      .then(function (s) { if (s && s.logged && s.email) state.session = s; })
      .catch(function () {})
      .then(function () { state.inFlight = false; });
  }

  function tick() {
    if (!CHECKOUT_PAGE.test(location.pathname)) { if (wrapper()) clear(); return; }
    var id = offerId();
    var link = id && LINKS[id];
    if (!link || state.nativeFor === id) { if (wrapper()) clear(); return; }
    var w = wrapper();
    if (w && w.getAttribute('data-flex-hsa-wrapper') === id) { setChoice(true); return; }
    if (w) clear();
    var target = container();
    if (!target) return;
    if (!state.session) { loadSession(); return; }
    render(id, link, target);
  }

  document.addEventListener('click', function (event) {
    var button = event.target && event.target.closest && event.target.closest('[data-flex-hsa-native]');
    if (!button) return;
    event.preventDefault();
    state.nativeFor = offerId();
    clear();
  }, true);

  function start() {
    var delay = location.pathname.indexOf('/r/') === 0 ? 1000 : 0;
    setTimeout(function () { tick(); setInterval(tick, 500); }, delay);
  }
  if (document.readyState === 'complete') start();
  else window.addEventListener('load', start);
})();
</script>

<!-- ============================================================
     TBM Ad Tracking - Click ID Capture Script
     Purpose: Captures Facebook (fbclid) and Google (gclid) click IDs
     from ad URLs and stores them in cookies for conversion tracking.

     How it works:
     1. When a user clicks a Facebook/Google ad, the URL contains a click ID
     2. This script captures that ID and stores it in a cookie
     3. When the user converts, n8n reads these cookies and sends to Meta/Google

     Cookies created:
     - _fbc: Facebook Click ID (format: fb.1.timestamp.fbclid)
     - _fbp: Facebook Browser ID (generated if not exists)
     - _gcl_aw: Google Click ID (raw gclid value)

     Last updated: 2026-02-02
     ============================================================ -->

<script>
(function() {
  'use strict';

  /* ----------------------------------------
     SECTION 1: URL Parameter Extraction
     Get click IDs from the current page URL
     ---------------------------------------- */
  var urlParams = new URLSearchParams(window.location.search);
  var fbclid = urlParams.get('fbclid');  // Facebook Click ID (from Meta ads)
  var gclid = urlParams.get('gclid');    // Google Click ID (from Google Ads)


  /* ----------------------------------------
     SECTION 2: Cookie Helper Functions
     Utilities for reading/writing cookies
     ---------------------------------------- */

  // Set a cookie with expiration in days
  function setCookie(name, value, days) {
    var expires = new Date(Date.now() + days * 864e5).toUTCString();
    document.cookie = name + '=' + encodeURIComponent(value) +
                  '; expires=' + expires +
                  '; path=/; domain=.thebloommethod.com; SameSite=Lax';
  }

  // Get a cookie value by name
  function getCookie(name) {
    return document.cookie.split('; ').reduce(function(result, cookie) {
      var parts = cookie.split('=');
      return parts[0] === name ? decodeURIComponent(parts[1]) : result;
    }, '');
  }


  /* ----------------------------------------
     SECTION 3: Facebook Click ID (_fbc)
     Format: fb.1.{timestamp_ms}.{fbclid_value}
     Stored for 90 days
     ---------------------------------------- */
  if (fbclid) {
    var fbc = 'fb.1.' + Date.now() + '.' + fbclid;
    setCookie('_fbc', fbc, 90);
    console.log('[TBM Tracking] Facebook Click ID captured:', fbclid);
  }


  /* ----------------------------------------
     SECTION 4: Facebook Browser ID (_fbp)
     Generated automatically if not exists
     Format: fb.1.{timestamp_ms}.{random_10_digit}
     Stored for 90 days
     ---------------------------------------- */
  if (!getCookie('_fbp')) {
    var fbp = 'fb.1.' + Date.now() + '.' + Math.floor(Math.random() * 1e10);
    setCookie('_fbp', fbp, 90);
    console.log('[TBM Tracking] Facebook Browser ID generated');
  }


  /* ----------------------------------------
     SECTION 5: Google Click ID (_gcl_aw)
     Raw gclid value from Google Ads
     Stored for 90 days
     ---------------------------------------- */
  if (gclid) {
    setCookie('_gcl_aw', gclid, 90);
    console.log('[TBM Tracking] Google Click ID captured:', gclid);
  }


  /* ----------------------------------------
